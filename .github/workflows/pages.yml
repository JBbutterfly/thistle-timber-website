name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/human-design-app-family-tree-ud1ulo
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site (exclude source, keep pre-built app)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='human-design-src' --exclude='_site' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
