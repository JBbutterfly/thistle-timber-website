services:
  homebook:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOMEBOOK_HOST: 0.0.0.0          # inside the container; the port mapping below controls exposure
      HOMEBOOK_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      # Home network only. Change to "127.0.0.1:8420:8420" to allow this machine only.
      # Never forward this port on your router.
      - "8420:8420"
